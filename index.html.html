<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Aesthetic BMI Calculator</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    background:linear-gradient(135deg,#0f172a,#111827,#1e1b4b);
    color:white;
}

/* BACKGROUND GLOW */

.glow1,
.glow2{
    position:absolute;
    border-radius:50%;
    filter:blur(120px);
    opacity:0.35;
}

.glow1{
    width:350px;
    height:350px;
    background:#8b5cf6;
    top:-100px;
    left:-100px;
}

.glow2{
    width:350px;
    height:350px;
    background:#06b6d4;
    bottom:-100px;
    right:-100px;
}

/* CARD */

.container{
    width:400px;
    padding:40px;
    border-radius:28px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 8px 35px rgba(0,0,0,0.4);
    position:relative;
    z-index:10;
}

.container h1{
    text-align:center;
    margin-bottom:10px;
    font-size:38px;
    background:linear-gradient(to right,#60a5fa,#c084fc);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.subtitle{
    text-align:center;
    color:#cbd5e1;
    margin-bottom:30px;
    font-size:15px;
}

/* INPUTS */

.input-group{
    margin-bottom:22px;
}

label{
    display:block;
    margin-bottom:8px;
    color:#dbeafe;
    font-size:14px;
}

input{
    width:100%;
    padding:16px;
    border:none;
    outline:none;
    border-radius:16px;
    background:rgba(255,255,255,0.07);
    color:white;
    font-size:16px;
    border:1px solid rgba(255,255,255,0.08);
}

input::placeholder{
    color:#94a3b8;
}

/* BUTTON */

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:18px;
    cursor:pointer;
    font-size:17px;
    font-weight:bold;
    color:white;
    background:linear-gradient(90deg,#3b82f6,#8b5cf6);
    transition:0.3s;
}

button:hover{
    transform:translateY(-3px) scale(1.02);
    box-shadow:0 8px 25px rgba(59,130,246,0.4);
}

/* RESULT */

.result{
    margin-top:28px;
    padding:22px;
    border-radius:18px;
    background:rgba(255,255,255,0.05);
    text-align:center;
    display:none;
}

.result h2{
    margin-bottom:10px;
    font-size:30px;
}

.result p{
    color:#cbd5e1;
    font-size:16px;
}

/* FOOTER */

.footer{
    margin-top:25px;
    text-align:center;
    color:#94a3b8;
    font-size:12px;
}

</style>
</head>
<body>

<div class="glow1"></div>
<div class="glow2"></div>

<div class="container">

    <h1>BMI Calculator</h1>

    <div class="subtitle">
        Simple • Modern • Aesthetic
    </div>

    <div class="input-group">
        <label>Height (cm)</label>
        <input type="number" id="height" placeholder="Enter your height">
    </div>

    <div class="input-group">
        <label>Weight (kg)</label>
        <input type="number" id="weight" placeholder="Enter your weight">
    </div>

    <button onclick="calculateBMI()">
        Calculate BMI
    </button>

    <div class="result" id="resultBox">
        <h2 id="bmiResult">0</h2>
        <p id="bmiText">Your BMI status</p>
    </div>

    <div class="footer">
        Healthy body, healthy life ✨
    </div>

</div>

<script>

function calculateBMI(){

    let height = document.getElementById("height").value;
    let weight = document.getElementById("weight").value;

    if(height === "" || weight === ""){
        alert("Please fill all fields.");
        return;
    }

    height = height / 100;

    let bmi = (weight / (height * height)).toFixed(1);

    let status = "";

    if(bmi < 18.5){
        status = "Underweight";
    }
    else if(bmi >= 18.5 && bmi < 25){
        status = "Normal Weight";
    }
    else if(bmi >= 25 && bmi < 30){
        status = "Overweight";
    }
    else{
        status = "Obese";
    }

    document.getElementById("resultBox").style.display = "block";
    document.getElementById("bmiResult").innerText = bmi;
    document.getElementById("bmiText").innerText = status;

}

</script>

</body>
</html>
